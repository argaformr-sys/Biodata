<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muhammad Arga Ahsanul Hakim — Owner Matsasu Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #0b0b0d;
      --bg-surface: #131317;
      --bg-elevated: #1a1a20;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(217, 119, 87, 0.35);
      --text-primary: #f4f4f6;
      --text-secondary: #9a9aa5;
      --text-muted: #666672;
      --accent: #d97757;
      --accent-soft: rgba(217, 119, 87, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(217, 119, 87, 0.09) 0%, transparent 55%),
        radial-gradient(circle at 85% 90%, rgba(255, 255, 255, 0.025) 0%, transparent 45%);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 2.25rem 2rem;
      box-shadow:
        0 24px 60px -12px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.02) inset;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.7;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .avatar-ring {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(145deg, var(--accent), rgba(255, 255, 255, 0.08));
      margin-bottom: 1.25rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 22%;
      border-radius: 50%;
      display: block;
      background-color: #0e0e11;
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid var(--border-accent);
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 0.85rem;
    }

    .role-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent);
    }

    .name {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--text-primary);
      max-width: 340px;
    }

    .divider {
      height: 1px;
      background: var(--border-subtle);
      margin: 1.5rem 0;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 0.95rem;
      padding: 0.85rem 1rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      transition: border-color 0.25s ease, transform 0.25s ease;
    }

    .info-item:hover {
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    .icon-box {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .icon-box svg {
      width: 18px;
      height: 18px;
      stroke-width: 1.75;
    }

    .info-content {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-width: 0;
    }

    .info-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .info-value {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .quote-box {
      margin-top: 1.5rem;
      padding: 1.25rem 1.35rem;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.025) 0%, rgba(255, 255, 255, 0.01) 100%);
      border: 1px solid var(--border-subtle);
      position: relative;
      text-align: center;
    }

    .quote-mark {
      display: block;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2rem;
      line-height: 0.8;
      color: var(--accent);
      opacity: 0.75;
      margin-bottom: 0.35rem;
    }

    .quote-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1.22rem;
      font-weight: 600;
      line-height: 1.45;
      color: #e6e6eb;
      letter-spacing: 0.01em;
    }

    .actions {
      margin-top: 1.5rem;
      display: flex;
      justify-content: center;
    }

    .btn-copy {
      width: 100%;
      padding: 0.8rem 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .btn-copy:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .btn-copy.copied {
      border-color: var(--border-accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn-copy svg {
      width: 15px;
      height: 15px;
    }

    @media (max-width: 420px) {
      .card {
        padding: 1.85rem 1.35rem;
        border-radius: 20px;
      }
      .name {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
